name: Administrative interface CI

on:
  pull_request:
    paths:
      - '**'
      - '.github/workflows/ci.yml'
  push:
    branches:
      - develop
      - main
    paths:
      - '**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Test, format and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --watch=false

      - name: Check formatting
        run: npx prettier --check src

      - name: Build production bundle
        run: npm run build

  image:
    name: Build container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag fieldops-admin:${{ github.sha }} .
