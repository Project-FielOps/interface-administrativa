name: Deploy administrative interface to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-admin-production
  cancel-in-progress: true

jobs:
  build:
    name: Build production bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: fieldops-admin-browser
          path: dist/fieldops-admin/browser

  deploy:
    name: Deploy frontend
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download bundle
        uses: actions/download-artifact@v4
        with:
          name: fieldops-admin-browser
          path: browser

      - name: Upload bundle over SCP
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: browser/*
          target: /home/ec2-user/fieldops-frontend-browser
          strip_components: 1

      - name: Restart frontend container
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            sudo docker restart fieldops-frontend
            sleep 3
            sudo docker exec fieldops-frontend nginx -t
            curl --fail --silent --show-error http://127.0.0.1/ >/dev/null
