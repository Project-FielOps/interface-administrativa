<mat-sidenav-container class="fo-shell">
  <mat-sidenav mode="side" opened class="fo-sidenav">
    <!-- Marca: bloco de logo + assinatura do sistema -->
    <div class="fo-brand" (click)="goToDashboard()" role="button" tabindex="0" (keydown.enter)="goToDashboard()">
      <div class="fo-brand__mark">
        <mat-icon>domain_verification</mat-icon>
      </div>
      <div class="fo-brand__text">
        <span class="fo-brand__name">FieldOps</span>
        <span class="fo-brand__tag">Precision System</span>
      </div>
    </div>

    <nav class="fo-nav">
      <span class="fo-nav__section">Operação</span>
      @for (item of visibleNavItems; track item.route) {
        <a
          class="fo-nav__item"
          [routerLink]="item.route"
          routerLinkActive="fo-active"
          [routerLinkActiveOptions]="{ exact: false }"
        >
          <mat-icon class="fo-nav__icon">{{ item.icon }}</mat-icon>
          <span class="fo-nav__label">{{ item.label }}</span>
        </a>
      }
    </nav>

    <!-- Rodapé de estado: espelha o indicador "Offline Ready" do protótipo -->
    <div class="fo-sidenav__footer">
      <span class="fo-status-dot"></span>
      <div class="fo-sidenav__footer-text">
        <span class="fo-sidenav__footer-label">Conectado</span>
        <span class="fo-sidenav__footer-meta">v1.0.0 · Produção</span>
      </div>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <header class="fo-toolbar-top">
      <div class="fo-toolbar-heading">
        <span class="fo-toolbar-eyebrow">FieldOps</span>
        <span class="fo-toolbar-title">Interface Administrativa</span>
      </div>
      <span class="fo-spacer"></span>
      @if (auth.currentUser(); as user) {
        <button class="fo-user-chip" [matMenuTriggerFor]="userMenu" type="button">
          <span class="fo-avatar">{{ initials(user.name) }}</span>
          <span class="fo-user-chip__text">
            <span class="fo-user-chip__name">{{ user.name }}</span>
            <span class="fo-role-badge">{{ roleLabel(user.role) }}</span>
          </span>
          <mat-icon class="fo-user-chip__caret">expand_more</mat-icon>
        </button>
        <mat-menu #userMenu="matMenu" class="fo-user-menu">
          <div class="fo-user-menu__header">
            <span class="fo-user-menu__name">{{ user.name }}</span>
            <span class="fo-user-menu__email">{{ user.email }}</span>
          </div>
          <mat-divider></mat-divider>
          <button mat-menu-item (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Sair</span>
          </button>
        </mat-menu>
      }
    </header>

    <main class="fo-content">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
