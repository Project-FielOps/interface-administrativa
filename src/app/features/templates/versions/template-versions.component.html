<div class="fo-page">
  <app-page-header title="Histórico de Versões" subtitle="Cada publicação gera uma versão imutável, usada por inspeções já agendadas.">
    <button mat-button (click)="back()"><mat-icon>arrow_back</mat-icon> Voltar ao editor</button>
  </app-page-header>

  <app-state-container
    [phase]="state().phase"
    [errorMessage]="state().errorMessage || ''"
    emptyMessage="Este modelo ainda não possui versões publicadas."
    emptyIcon="history"
    [retry]="load.bind(this)"
    [content]="tableTpl"
  ></app-state-container>

  <ng-template #tableTpl>
    <table mat-table [dataSource]="state().data || []">
      <ng-container matColumnDef="versionNumber">
        <th mat-header-cell *matHeaderCellDef>Versão</th>
        <td mat-cell *matCellDef="let v">v{{ v.versionNumber }}</td>
      </ng-container>
      <ng-container matColumnDef="titleSnapshot">
        <th mat-header-cell *matHeaderCellDef>Título (na publicação)</th>
        <td mat-cell *matCellDef="let v">{{ v.titleSnapshot }}</td>
      </ng-container>
      <ng-container matColumnDef="publishedAt">
        <th mat-header-cell *matHeaderCellDef>Publicado em</th>
        <td mat-cell *matCellDef="let v">{{ v.publishedAt | date: 'dd/MM/yyyy HH:mm' }}</td>
      </ng-container>
      <ng-container matColumnDef="activeForNewInspections">
        <th mat-header-cell *matHeaderCellDef>Disponível para novos agendamentos</th>
        <td mat-cell *matCellDef="let v">{{ v.activeForNewInspections ? 'Sim' : 'Não' }}</td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </ng-template>
</div>
