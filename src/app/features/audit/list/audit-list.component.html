<div class="fo-page">
  <app-page-header title="Auditoria" subtitle="Registro somente leitura das ações relevantes do sistema."></app-page-header>

  <form [formGroup]="filterForm" class="fo-filters">
    <mat-form-field>
      <mat-label>Tipo de entidade</mat-label>
      <input matInput formControlName="entityType" placeholder="Ex.: INSPECTION, USER" />
    </mat-form-field>
    <mat-form-field>
      <mat-label>De</mat-label>
      <input matInput [matDatepicker]="fromPicker" formControlName="from" />
      <mat-datepicker-toggle matIconSuffix [for]="fromPicker"></mat-datepicker-toggle>
      <mat-datepicker #fromPicker></mat-datepicker>
    </mat-form-field>
    <mat-form-field>
      <mat-label>Até</mat-label>
      <input matInput [matDatepicker]="toPicker" formControlName="to" />
      <mat-datepicker-toggle matIconSuffix [for]="toPicker"></mat-datepicker-toggle>
      <mat-datepicker #toPicker></mat-datepicker>
    </mat-form-field>
  </form>

  <app-state-container
    [phase]="state().phase"
    [errorMessage]="state().errorMessage || ''"
    emptyMessage="Nenhum evento de auditoria encontrado."
    emptyIcon="history"
    [retry]="load.bind(this)"
    [content]="tableTpl"
  ></app-state-container>

  <ng-template #tableTpl>
    <table mat-table [dataSource]="state().data || []">
      <ng-container matColumnDef="occurredAt">
        <th mat-header-cell *matHeaderCellDef>Data/hora</th>
        <td mat-cell *matCellDef="let e">{{ e.occurredAt | date: 'dd/MM/yyyy HH:mm:ss' }}</td>
      </ng-container>
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>Ação</th>
        <td mat-cell *matCellDef="let e">{{ e.action }}</td>
      </ng-container>
      <ng-container matColumnDef="entityType">
        <th mat-header-cell *matHeaderCellDef>Entidade</th>
        <td mat-cell *matCellDef="let e">{{ e.entityType }}</td>
      </ng-container>
      <ng-container matColumnDef="entityId">
        <th mat-header-cell *matHeaderCellDef>ID da entidade</th>
        <td mat-cell *matCellDef="let e">{{ e.entityId }}</td>
      </ng-container>
      <ng-container matColumnDef="actorName">
        <th mat-header-cell *matHeaderCellDef>Autor</th>
        <td mat-cell *matCellDef="let e">{{ e.actorName || e.actorId || 'Sistema' }}</td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
    <mat-paginator [length]="totalElements()" [pageSize]="pageSize()" [pageIndex]="pageIndex()" [pageSizeOptions]="[20,50,100]" (page)="onPage($event)"></mat-paginator>
  </ng-template>
</div>
