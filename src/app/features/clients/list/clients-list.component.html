<div class="fo-page">
  <app-page-header title="Clientes" subtitle="Empresas e organizações atendidas.">
    <button mat-raised-button color="primary" (click)="openCreate()">
      <mat-icon>add</mat-icon> Novo cliente
    </button>
  </app-page-header>

  <form [formGroup]="filterForm" class="fo-filters">
    <mat-form-field>
      <mat-label>Buscar por nome ou documento</mat-label>
      <input matInput formControlName="search" />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
    <mat-form-field>
      <mat-label>Status</mat-label>
      <mat-select formControlName="status">
        <mat-option value="">Todos</mat-option>
        <mat-option value="ACTIVE">Ativo</mat-option>
        <mat-option value="INACTIVE">Inativo</mat-option>
      </mat-select>
    </mat-form-field>
  </form>

  <app-state-container
    [phase]="state().phase"
    [errorMessage]="state().errorMessage || ''"
    emptyMessage="Nenhum cliente cadastrado ainda."
    emptyIcon="business"
    [retry]="load.bind(this)"
    [content]="tableTpl"
  ></app-state-container>

  <ng-template #tableTpl>
    <table mat-table [dataSource]="state().data || []">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let c">
          <a (click)="viewSites(c)" class="fo-link">{{ c.name }}</a>
        </td>
      </ng-container>
      <ng-container matColumnDef="document">
        <th mat-header-cell *matHeaderCellDef>Documento</th>
        <td mat-cell *matCellDef="let c">{{ c.document || '-' }}</td>
      </ng-container>
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>E-mail</th>
        <td mat-cell *matCellDef="let c">{{ c.email || '-' }}</td>
      </ng-container>
      <ng-container matColumnDef="phone">
        <th mat-header-cell *matHeaderCellDef>Telefone</th>
        <td mat-cell *matCellDef="let c">{{ c.phone || '-' }}</td>
      </ng-container>
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let c"><span [class]="'fo-chip-' + c.status.toLowerCase()">{{ c.status }}</span></td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let c">
          <button mat-icon-button [matMenuTriggerFor]="menu">
            <mat-icon>more_vert</mat-icon>
          </button>
          <mat-menu #menu="matMenu">
            <button mat-menu-item (click)="viewSites(c)"><mat-icon>place</mat-icon><span>Ver locais</span></button>
            <button mat-menu-item (click)="openEdit(c)"><mat-icon>edit</mat-icon><span>Editar</span></button>
            <button mat-menu-item (click)="toggleStatus(c)">
              <mat-icon>{{ c.status === 'INACTIVE' ? 'check_circle' : 'block' }}</mat-icon>
              <span>{{ c.status === 'INACTIVE' ? 'Ativar' : 'Inativar' }}</span>
            </button>
          </mat-menu>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
    <mat-paginator [length]="totalElements()" [pageSize]="pageSize()" [pageIndex]="pageIndex()" [pageSizeOptions]="[10,25,50]" (page)="onPage($event)"></mat-paginator>
  </ng-template>
</div>
