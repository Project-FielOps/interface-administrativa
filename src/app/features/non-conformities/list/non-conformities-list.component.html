<div class="fo-page">
  <app-page-header
    title="Não Conformidades"
    subtitle="Problemas e desvios identificados durante as inspeções. Informe o ID de uma inspeção para consultar."
  ></app-page-header>

  <details class="fo-filter-panel" open>
    <summary><mat-icon>filter_alt</mat-icon> Filtros</summary>
    <form [formGroup]="filterForm" class="fo-filters">
      <mat-form-field>
        <mat-label>ID da inspeção</mat-label>
        <input matInput formControlName="inspectionId" placeholder="UUID da inspeção" />
      </mat-form-field>
      <mat-form-field>
        <mat-label>Severidade</mat-label>
        <mat-select formControlName="severity">
          <mat-option value="">Todas</mat-option>
          <mat-option value="LOW">Baixa</mat-option>
          <mat-option value="MEDIUM">Média</mat-option>
          <mat-option value="HIGH">Alta</mat-option>
          <mat-option value="CRITICAL">Crítica</mat-option>
        </mat-select>
      </mat-form-field>
    </form>
  </details>

  <app-state-container
    [phase]="displayPhase()"
    [errorMessage]="state().errorMessage || ''"
    emptyMessage="Informe o ID de uma inspeção acima para ver suas não conformidades."
    emptyIcon="report_problem"
    [retry]="search.bind(this)"
    [clearFilters]="clearFilters.bind(this)"
    [content]="listTpl"
  ></app-state-container>

  <ng-template #listTpl>
    <table mat-table [dataSource]="filtered()">
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef>Título</th>
        <td mat-cell *matCellDef="let nc">{{ nc.title }}</td>
      </ng-container>
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Descrição</th>
        <td mat-cell *matCellDef="let nc">{{ nc.description || '-' }}</td>
      </ng-container>
      <ng-container matColumnDef="severity">
        <th mat-header-cell *matHeaderCellDef>Severidade</th>
        <td mat-cell *matCellDef="let nc">
          <app-status-badge [value]="nc.severity"></app-status-badge>
        </td>
      </ng-container>
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let nc">
          <app-status-badge [value]="nc.status"></app-status-badge>
        </td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let nc">
          <button mat-button color="primary" (click)="viewInspection(nc)">
            <mat-icon>open_in_new</mat-icon> Ver inspeção
          </button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </ng-template>
</div>
